<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<meta name="referrer" content="same-origin" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>자판기 봇 관리자 패널</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://media.valorant-api.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/app.css?v=23" />
<script src="/assets/js/chart.umd.min.js?v=23" defer></script>
<script src="/assets/js/anime.min.js?v=23" defer></script>
<script src="/assets/js/util.js?v=23" defer></script>
<script src="/assets/js/api.js?v=23" defer></script>
<script src="/assets/js/ui.js?v=23" defer></script>
<script src="/assets/js/admin.js?v=23" defer></script>
<script src="/assets/js/router.js?v=23" defer></script>
<script src="/assets/js/dashboard.js?v=23" defer></script>
<script src="/assets/js/stock.js?v=23" defer></script>
<script src="/assets/js/orders.js?v=23" defer></script>
<script src="/assets/js/users.js?v=23" defer></script>
<script src="/assets/js/vip.js?v=23" defer></script>
<script src="/assets/js/deposit.js?v=23" defer></script>
<script src="/assets/js/announce.js?v=23" defer></script>
<script src="/assets/js/logs.js?v=23" defer></script>
<script src="/assets/js/panel.js?v=23" defer></script>
<script src="/assets/js/app.js?v=23" defer></script>
</head>
<body>
<div id="route-bar" aria-hidden="true"></div>
<div id="login-screen">
  <div class="login-glow" aria-hidden="true"></div>
  <div class="login-card">
    <div class="login-kicker">DISCORD VENDING</div>
    <h1>관리자 로그인</h1>
    <p class="login-desc">자판기 운영 패널에 들어갑니다.</p>

    <div id="login-error" class="login-error hidden">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span id="login-error-text">아이디 또는 비밀번호가 올바르지 않습니다.</span>
    </div>

    <form id="login-form" onsubmit="login(event); return false;">
      <div class="field">
        <label for="login-id">아이디</label>
        <input class="input" type="text" id="login-id" autocomplete="username" placeholder="아이디" />
      </div>
      <div class="field">
        <label for="login-pw">비밀번호</label>
        <input class="input" type="password" id="login-pw" autocomplete="current-password" placeholder="비밀번호" />
      </div>
      <button type="button" class="btn btn-primary btn-block" id="login-btn" onclick="login(event)">로그인</button>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <div class="nav-label">운영</div>
      <a class="nav-item active" href="/" data-view="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        대시보드
      </a>
      <a class="nav-item" href="/products" data-view="products">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        상품 관리
      </a>
      <a class="nav-item" href="/orders" data-view="orders">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h6"/></svg>
        주문 내역
      </a>
      <a class="nav-item" href="/users" data-view="users">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87"/></svg>
        유저/잔액
      </a>
      <a class="nav-item" href="/vip" data-view="vip">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-3.8L6 21l1.5-7.5L2 9h7z"/></svg>
        VIP 티어
      </a>
      <a class="nav-item" href="/charges" data-view="charges">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        충전 관리
        <span class="nav-badge" id="nav-charge-badge">0</span>
      </a>
      <a class="nav-item" href="/announce" data-view="announce">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        공지 / DM
      </a>

      <div class="nav-label">설정</div>
      <a class="nav-item" href="/panel" data-view="panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        자판기 패널 설정
      </a>
      <a class="nav-item" href="/logs" data-view="logs">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
        로그 설정
      </a>
      <a class="nav-item" href="/login-logs" data-view="loginlogs">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        로그인 로그
      </a>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="btn btn-logout btn-block" data-action="logout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        로그아웃
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div style="display:flex;align-items:center;gap:14px">
        <button type="button" class="icon-btn menu-toggle" aria-label="메뉴 열기/닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div>
          <div class="page-title" id="header-title">대시보드</div>
          <div class="page-sub" id="header-sub">오늘의 판매 현황을 확인하세요</div>
        </div>
      </div>
      <div class="header-right">
        <div class="server-selector">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
          <div style="display:flex;flex-direction:column">
            <span class="lbl">서버</span>
            <div id="server-select-slot"><select id="server-select" class="select" onchange="onServerChange()"></select></div>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-wrap"></div>
</body>
</html>
